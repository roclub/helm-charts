apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "booking-tool.fullname" . }}-deployment-config
  {{- with .Values.config.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "booking-tool.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      port: {{ .Values.service.httpPort }}
    database:
      dsn: {{ include "booking-tool.postgresURL" (dict "root" . "user" .Values.postgres.users.runtime) | quote }}
    {{- omit .Values.config "annotations" | toYaml | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "booking-tool.fullname" . }}-migration-config
  {{- with .Values.config.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "booking-tool.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
data:
  migrate.yaml: |
    database:
      dsn: {{ include "booking-tool.postgresURL" (dict "root" . "user" .Values.postgres.users.migration) | quote }}
