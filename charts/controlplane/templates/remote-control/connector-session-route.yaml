{{- if eq .Values.stage "dev" }}
{{- $gatewayName := include "controlplane.fullname" . -}}
{{- $name := include "controlplane.remoteControlName" . -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $gatewayName }}-remote-control-connector-session
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gatewayName }}
  hostnames:
  {{- range .Values.recordNames }}
    - {{ . }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /controlplane.v1.ConnectorSession/Connect
          method: POST
      backendRefs:
        - name: {{ $name }}
          port: {{ .Values.remoteControl.service.gRPCPort }}
{{- end }}
