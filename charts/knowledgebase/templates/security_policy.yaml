{{- $fullname := include "knowledgebase.fullname" . -}}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $fullname }}-oidc-zitadel
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ $fullname }}-oidc
  oidc:
    provider:
      issuer: "{{ .Values.httpRoute.oidc.provider.issuer }}"
    clientID: "{{ .Values.httpRoute.oidc.clientID }}"
    clientSecret: 
      name: "{{ $fullname }}-oauth-secret"
    redirectURL: "{{ .Values.httpRoute.oidc.redirectURL }}"
    logoutPath: "{{ .Values.httpRoute.oidc.logoutPath }}"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $fullname }}-oidc-zitadel-de
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ $fullname }}-oidc-de
  oidc:
    provider:
      issuer: "{{ .Values.httpRoute.oidc.provider.issuer }}"
    clientID: "{{ .Values.httpRoute.oidc.clientID }}"
    clientSecret: 
      name: "{{ $fullname }}-oauth-secret"
    redirectURL: "{{ .Values.httpRoute.oidc.redirectURL }}"
    logoutPath: "{{ .Values.httpRoute.oidc.logoutPath }}"
---
apiVersion: v1
data:
  client-secret: {{ .Values.httpRoute.oidc.clientSecret | b64enc }} 
kind: Secret
metadata:
  name: "{{ $fullname }}-oauth-secret"

