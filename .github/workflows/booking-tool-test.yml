name: Test booking-tool chart

on:
  pull_request:
    paths:
      - "charts/booking-tool/**"
      - "tests/**"
      - ".github/workflows/booking-tool-test.yml"
  push:
    branches: [main]
    paths:
      - "charts/booking-tool/**"
      - "tests/**"
      - ".github/workflows/booking-tool-test.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        helm: ["v3.17.3", "v4.1.4"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ matrix.helm }}

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Lint default and sample values
        run: |
          helm lint charts/booking-tool --strict
          helm lint charts/booking-tool --strict --values tests/booking-tool/values.yaml

      - name: Test rendered manifests
        run: python -m unittest discover -s tests/booking-tool -p 'test_*.py' -v

      - name: Package chart
        run: helm package charts/booking-tool --destination "$RUNNER_TEMP"
